<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asistente Mara</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }
    .container {
      text-align: center;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    button.recording {
      background-color: #dc3545;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Asistente de Voz - Mara</h2>
    <button id="micBtn">Hablar con Mara</button>
    <div id="status">Presiona para hablar</div>
  </div>

  <script>
    const WEBHOOK_URL = 'TU_WEBHOOK_URL_AQUI'; // Reemplaza por la URL de tu primer módulo Webhook en Make

    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('status');

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    micBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
          };

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            await enviarAudioAMara(audioBlob);
          };

          mediaRecorder.start();
          isRecording = true;
          micBtn.textContent = 'Detener grabación';
          micBtn.classList.add('recording');
          statusText.textContent = 'Escuchando...';
        } catch (err) {
          statusText.textContent = 'Error al acceder al micrófono.';
          console.error(err);
        }
      } else {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        isRecording = false;
        micBtn.textContent = 'Hablar con Mara';
        micBtn.classList.remove('recording');
        statusText.textContent = 'Procesando respuesta...';
      }
    });

    async function enviarAudioAMara(blob) {
      try {
        const formData = new FormData();
        formData.append('file', blob, 'audio.wav');

        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error('Error en la comunicación con el servidor');
        }

        const audioResponse = await response.blob();
        const audioUrl = URL.createObjectURL(audioResponse);
        
        statusText.textContent = 'Mara respondiendo...';
        const player = new Audio(audioUrl);
        
        player.play();
        player.onended = () => {
          statusText.textContent = 'Presiona para hablar';
        };
      } catch (error) {
        statusText.textContent = 'Error al recibir la voz de Mara.';
        console.error(error);
      }
    }
  </script>

</body>
</html>
