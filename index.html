<script>
    const MAKE_WEBHOOK_URL = "https://hook.us2.make.com/fxk2ibpvmut811i2fcg4yb56saasskfc"; 

    // Reloj y fecha
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}`;
        
        const options = { weekday: 'long', month: 'long', day: 'numeric' };
        document.getElementById('date').textContent = now.toLocaleDateString('es-ES', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Variables globales
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let silenceTimer;
    let audioContext;
    let analyser;
    let microphone;

    // Configurar reconocimiento de palabra clave
    function initWakeWord() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("Tu navegador no soporta reconocimiento de voz continuo.");
            return;
        }

        const recognizer = new SpeechRecognition();
        recognizer.continuous = true;
        recognizer.interimResults = true;
        recognizer.lang = 'es-ES';

        recognizer.onresult = (event) => {
            if (isRecording) return; // Si ya está grabando la orden, no procesar el Wake Word

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                const text = event.results[i][0].transcript.toLowerCase().trim();
                console.log("Escuchando:", text);

                if (text.includes("mara") || text.includes("oye mara")) {
                    console.log("¡Wake Word detectada!");
                    startAutoRecording();
                    break;
                }
            }
        };

        recognizer.onend = () => {
            // Se reinicia solo para mantenerse siempre activo
            if (!isRecording) {
                try { recognizer.start(); } catch(e) {}
            }
        };

        try {
            recognizer.start();
            document.getElementById('status').textContent = "Escuchando en segundo plano... Di 'Oye Mara'";
        } catch(e) {
            console.error("Error iniciando escucha pasiva:", e);
        }
    }

    // Iniciar grabación automática al detectar la palabra
    async function startAutoRecording() {
        if (isRecording) return;
        isRecording = true;

        const orb = document.getElementById('orb');
        const status = document.getElementById('status');
        const responseText = document.getElementById('response-text');

        // Cambiar visualmente a rojo (escuchando la consulta)
        orb.className = "orb recording";
        status.textContent = "Te escucho... habla tu consulta";
        responseText.textContent = "";

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            // Análisis de volumen para detectar cuando te quedas en silencio
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);
            analyser.fftSize = 256;
            
            detectSilence(stream);

            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                // Cambiar visualmente a morado (pensando)
                orb.className = "orb thinking";
                status.textContent = "Mara está pensando...";

                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append("file", audioBlob, "audio.webm");

                try {
                    const response = await fetch(MAKE_WEBHOOK_URL, {
                        method: "POST",
                        body: formData
                    });

                    if (response.ok) {
                        const resultText = await response.text();
                        status.textContent = "Mara dice:";
                        responseText.textContent = resultText;
                    } else {
                        status.textContent = "Error al recibir respuesta de Make";
                    }
                } catch (e) {
                    status.textContent = "Error de conexión con Make";
                } finally {
                    // Volver a estado azul pasivo
                    orb.className = "orb";
                    status.textContent = "Di 'Oye Mara' para otra consulta";
                    isRecording = false;
                }
            };

            mediaRecorder.start();

        } catch (err) {
            console.error("Error al acceder al micrófono:", err);
            isRecording = false;
            orb.className = "orb";
        }
    }

    // Detectar cuando dejas de hablar por 2 segundos
    function detectSilence(stream) {
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        
        function checkVolume() {
            if (!isRecording) return;

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < bufferLength; i++) {
                sum += dataArray[i];
            }
            let average = sum / bufferLength;

            // Si el volumen promedio es muy bajo (silencio)
            if (average < 10) { 
                if (!silenceTimer) {
                    silenceTimer = setTimeout(() => {
                        stopAutoRecording(stream);
                    }, 2000); // 2 segundos de silencio para cortar
                }
            } else {
                // Si vuelves a hablar, resetea el temporizador de silencio
                clearTimeout(silenceTimer);
                silenceTimer = null;
            }

            requestAnimationFrame(checkVolume);
        }

        checkVolume();
    }

    // Detener la grabación
    function stopAutoRecording(stream) {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
            stream.getTracks().forEach(track => track.stop());
            if (audioContext) audioContext.close();
            clearTimeout(silenceTimer);
            silenceTimer = null;
        }
    }

    // Iniciar el sistema al cargar la página
    window.addEventListener('load', () => {
        initWakeWord();
    });
</script>
