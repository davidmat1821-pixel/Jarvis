<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mara IA</title>
    <style>
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        #clock {
            font-size: 4rem;
            font-weight: 300;
            color: #00d2ff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            text-align: center;
        }
        #date {
            font-size: 1.2rem;
            color: #8a99ad;
            text-align: center;
            margin-top: 10px;
            text-transform: capitalize;
        }
        .orb {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 70%, transparent 100%);
            box-shadow: 0 0 50px #00d2ff;
            animation: pulse 3s infinite ease-in-out;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .recording {
            background: radial-gradient(circle, #ff0055 0%, #ff4b2b 70%, transparent 100%) !important;
            box-shadow: 0 0 60px #ff0055 !important;
            animation: pulse-fast 0.8s infinite ease-in-out !important;
        }
        .thinking {
            background: radial-gradient(circle, #a855f7 0%, #6b21a8 70%, transparent 100%) !important;
            box-shadow: 0 0 40px #a855f7 !important;
            animation: none !important;
            transform: scale(1) !important;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(0.95); }
        }
        @keyframes pulse-fast {
            0% { transform: scale(0.92); }
            50% { transform: scale(1.1); }
            100% { transform: scale(0.92); }
        }
        #status {
            font-size: 1.2rem;
            color: #a0aec0;
            text-align: center;
            min-height: 1.5em;
        }
        #response-text {
            font-size: 1.1rem;
            color: #e2e8f0;
            text-align: center;
            max-width: 80%;
            margin-top: 10px;
            min-height: 2em;
        }
    </style>
</head>
<body>

    <div>
        <div id="clock">00:00</div>
        <div id="date">Cargando fecha...</div>
    </div>

    <div id="orb" class="orb" onclick="handleOrbClick()"></div>

    <div style="text-align: center;">
        <div id="status">Toca la esfera para hablar con Mara</div>
        <div id="response-text"></div>
    </div>

    <script>
        const MAKE_WEBHOOK_URL = "https://hook.us2.make.com/fxk2ibpvmut811i2fcg4yb56saasskfc"; 

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('es-ES', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function handleOrbClick() {
            const orb = document.getElementById('orb');
            const status = document.getElementById('status');
            const responseText = document.getElementById('response-text');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = async () => {
                        orb.className = "orb thinking";
                        status.textContent = "Mara está pensando...";
                        
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const formData = new FormData();
                        formData.append("file", audioBlob, "audio.webm");

                        try {
                            const response = await fetch(MAKE_WEBHOOK_URL, {
                                method: "POST",
                                body: formData
                            });
                            
                            if (response.ok) {
                                const resultText = await response.text();
                                status.textContent = "Mara dice:";
                                responseText.textContent = resultText;
                            } else {
                                status.textContent = "Error al recibir respuesta de Make";
                            }
                        } catch (e) {
                            status.textContent = "Error de conexión con Make";
                        } finally {
                            orb.className = "orb";
                        }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    orb.className = "orb recording";
                    status.textContent = "Escuchando... (Toca de nuevo para enviar)";
                    responseText.textContent = "";

                } catch (err) {
                    alert("Error al acceder al micrófono. Si estás abriendo el archivo localmente, ejecuta la aplicación mediante un servidor local como Live Server.");
                    console.error(err);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }
    </script>
</body>
</html>
