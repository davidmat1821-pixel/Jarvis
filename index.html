<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mara IA</title>
    <style>
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        #clock {
            font-size: 4rem;
            font-weight: 300;
            color: #00d2ff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            text-align: center;
        }
        #date {
            font-size: 1.2rem;
            color: #8a99ad;
            text-align: center;
            margin-top: 10px;
            text-transform: capitalize;
        }
        .orb {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            /* Centro mucho más brillante con blanco intenso (#ffffff) */
            background: radial-gradient(circle, #ffffff 0%, #00d2ff 35%, #3a7bd5 75%, transparent 100%);
            box-shadow: 0 0 60px #00d2ff, inset 0 0 15px #ffffff;
            animation: pulse 3s infinite ease-in-out;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .recording {
            background: radial-gradient(circle, #ffffff 0%, #ff0055 40%, #ff4b2b 75%, transparent 100%) !important;
            box-shadow: 0 0 70px #ff0055, inset 0 0 20px #ffffff !important;
            animation: pulse-fast 0.8s infinite ease-in-out !important;
        }
        .thinking {
            background: radial-gradient(circle, #ffffff 0%, #a855f7 40%, #6b21a8 75%, transparent 100%) !important;
            box-shadow: 0 0 50px #a855f7, inset 0 0 15px #ffffff !important;
            animation: none !important;
            transform: scale(1) !important;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(0.95); }
        }
        @keyframes pulse-fast {
            0% { transform: scale(0.92); }
            50% { transform: scale(1.1); }
            100% { transform: scale(0.92); }
        }
        #status {
            font-size: 1.2rem;
            color: #a0aec0;
            text-align: center;
            min-height: 1.5em;
        }
        #response-text {
            font-size: 1.1rem;
            color: #e2e8f0;
            text-align: center;
            max-width: 80%;
            margin-top: 10px;
            min-height: 2em;
        }
    </style>
</head>
<body>

    <div>
        <div id="clock">00:00</div>
        <div id="date">Cargando fecha...</div>
    </div>

    <div id="orb" class="orb"></div>

    <div style="text-align: center;">
        <div id="status">Haz un clic inicial en la pantalla para activar...</div>
        <div id="response-text"></div>
    </div>

    <script>
        const MAKE_WEBHOOK_URL = "https://hook.us2.make.com/fxk2ibpvmut811i2fcg4yb56saasskfc"; 

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('es-ES', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let mainRecognizer;

        // Función para leer la respuesta usando la voz nativa del navegador
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Detener audios anteriores
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                
                utterance.onend = () => {
                    document.getElementById('status').textContent = "Di 'Mara' para hablar y 'Please' para enviar.";
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        function initMaraVoiceEngine() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                document.getElementById('status').textContent = "Navegador no compatible con reconocimiento de voz.";
                return;
            }

            mainRecognizer = new SpeechRecognition();
            mainRecognizer.continuous = true;
            mainRecognizer.interimResults = true;
            mainRecognizer.lang = 'es-ES';

            mainRecognizer.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript.toLowerCase().trim();

                    if (!isRecording) {
                        if (transcript.includes("mara") || transcript.includes("oye mara")) {
                            startAudioRecording();
                            break;
                        }
                    } else {
                        const EnglishStop = (
                            transcript.endsWith("please") || 
                            transcript.endsWith("pless") || 
                            transcript.endsWith("ples") || 
                            transcript.endsWith("pleas") ||
                            transcript.includes(" please ") ||
                            transcript.includes(" pless ")
                        );

                        if (EnglishStop) {
                            stopAudioRecording();
                            break;
                        }
                    }
                }
            };

            mainRecognizer.onend = () => {
                try { mainRecognizer.start(); } catch(e) {}
            };

            try {
                mainRecognizer.start();
                document.getElementById('status').textContent = "Di 'Mara' para hablar y 'Please' para enviar.";
            } catch(e) {
                console.error("Error al iniciar motor de voz:", e);
            }
        }

        async function startAudioRecording() {
            if (isRecording) return;
            isRecording = true;

            const orb = document.getElementById('orb');
            const status = document.getElementById('status');
            const responseText = document.getElementById('response-text');

            orb.className = "orb recording";
            status.textContent = "Te escucho... di 'Please' al terminar.";
            responseText.textContent = "";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    } 
                });

                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    orb.className = "orb thinking";
                    status.textContent = "Mara está pensando...";

                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append("file", audioBlob, "audio.webm");

                    try {
                        const response = await fetch(MAKE_WEBHOOK_URL, {
                            method: "POST",
                            body: formData
                        });

                        if (response.ok) {
                            const data = await response.json();
                            const answerText = data.text || "No recibí respuesta.";

                            status.textContent = "Mara respondiendo...";
                            responseText.textContent = answerText;

                            // Hablar la respuesta recibida en JSON
                            speakText(answerText);
                        } else {
                            status.textContent = "Error al recibir respuesta de Make.";
                        }
                    } catch (e) {
                        status.textContent = "Error de conexión con Make.";
                    } finally {
                        orb.className = "orb";
                        isRecording = false;
                    }
                };

                mediaRecorder.start();

            } catch (err) {
                console.error("Error al acceder al micrófono:", err);
                isRecording = false;
                orb.className = "orb";
            }
        }

        function stopAudioRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }

        window.addEventListener('load', () => {
            document.body.addEventListener('click', function unlockAudio() {
                initMaraVoiceEngine();
                document.body.removeEventListener('click', unlockAudio);
            }, { once: true });
        });
    </script>
</body>
</html>
